<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient1)"/>

  <!-- Toolbox icon -->
  <g transform="translate(100, 120)">
    <!-- Main toolbox body -->
    <rect x="40" y="120" width="240" height="180" rx="16" fill="white" opacity="0.95"/>
    <rect x="40" y="120" width="240" height="180" rx="16" fill="url(#gradient2)" opacity="0.3"/>

    <!-- Toolbox handle -->
    <path d="M 120 120 Q 120 80 160 80 Q 200 80 200 120" stroke="white" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.95"/>

    <!-- Tools inside -->
    <!-- Wrench -->
    <g transform="translate(70, 160)">
      <rect x="0" y="20" width="50" height="12" rx="6" fill="url(#gradient3)" transform="rotate(-45 25 26)"/>
      <circle cx="8" cy="28" r="10" fill="url(#gradient3)"/>
    </g>

    <!-- Screwdriver -->
    <g transform="translate(140, 165)">
      <rect x="10" y="0" width="8" height="60" rx="4" fill="url(#gradient4)"/>
      <rect x="6" y="55" width="16" height="30" rx="3" fill="#FFB800"/>
    </g>

    <!-- Hammer -->
    <g transform="translate(190, 160)">
      <rect x="20" y="20" width="8" height="55" rx="4" fill="#8B4513"/>
      <rect x="5" y="15" width="38" height="20" rx="4" fill="url(#gradient5)"/>
    </g>

    <!-- Divider line -->
    <line x1="60" y1="250" x2="260" y2="250" stroke="white" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

    <!-- Bottom compartment indicators -->
    <circle cx="100" cy="270" r="8" fill="white" opacity="0.6"/>
    <circle cx="160" cy="270" r="8" fill="white" opacity="0.6"/>
    <circle cx="220" cy="270" r="8" fill="white" opacity="0.6"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#94A3B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
